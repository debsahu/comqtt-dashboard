apiVersion: v2
name: comqtt-dashboard
description: |
  Web dashboard add-on for comqtt, the lightweight Go MQTT broker. Ships the
  broker plus the dashboard as a single image and supports both single-mode
  (Deployment) and cluster-mode (StatefulSet with Raft + Gossip + Redis).
type: application
version: 0.2.1
appVersion: "0.3.1"
kubeVersion: ">=1.23.0-0"
home: https://github.com/debsahu/comqtt-dashboard
sources:
  - https://github.com/debsahu/comqtt-dashboard
keywords:
  - mqtt
  - broker
  - iot
  - messaging
  - pub-sub
  - cluster
  - raft
  - dashboard
maintainers:
  - name: Debashish Sahu
    url: https://github.com/debsahu
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: initAuth now installs the upstream auth.Hook for the file backend (auth-ds=0). Pre-fix, --auth-way=1 --auth-ds=0 left no hook registered and the broker default-denied all connections.
    - kind: added
      description: Authentication page banner noting the file backend's broker-restart requirement for ledger reloads.
  artifacthub.io/license: MIT
