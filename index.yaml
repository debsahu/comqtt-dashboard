apiVersion: v1
entries:
  comqtt-dashboard:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Optional regex authorization (EMQX-style). Enable with --auth-regex=true / config.auth.regex.enabled=true. Adds /dashboard/mqtt-acl-regex page for managing rules; broker installs comqttauth.Hook alongside the upstream auth plugin in coexist mode.
        - kind: added
          description: Strict-mode seed via --auth-regex-strict=true / config.auth.regex.strict=true. First-load seeds a deny-all rule instead of allow-all; operators add explicit allow rules to whitelist.
        - kind: changed
          description: Upstream comqtt bumped to v2.6.4 (was on local main since v0.3.1, ships in this release).
      artifacthub.io/license: MIT
    apiVersion: v2
    appVersion: 0.4.0
    created: "2026-05-14T02:43:48.893269675Z"
    description: 'Web dashboard add-on for comqtt, the lightweight Go MQTT broker.
      Ships the broker plus the dashboard as a single image and supports both single-mode
      (Deployment) and cluster-mode (StatefulSet with Raft + Gossip + Redis). '
    digest: e44c35778529a0a3ed14d49e63d0170801258f0aa8f5b5fd27cc5e1c94e65f77
