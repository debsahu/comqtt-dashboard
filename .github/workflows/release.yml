name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # for chart-releaser to push the index to gh-pages
  packages: write    # for ghcr image push

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Multi-arch image -> ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/comqtt-dashboard
          # Tag both the bare SemVer (e.g. 0.2.0) and "latest" on stable tags.
          # Pre-release tags (e.g. v0.2.0-rc1) skip "latest".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart -> gh-pages
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Release chart (chart-releaser-action)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
